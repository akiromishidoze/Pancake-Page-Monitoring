name: Weekly Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (all levels)
        run: npx npm audit --json > audit-report.json || true

      - name: Check for vulnerabilities
        id: check
        run: |
          VULNS=$(node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('audit-report.json','utf8'));
            const low = r.metadata.vulnerabilities.low || 0;
            const moderate = r.metadata.vulnerabilities.moderate || 0;
            const high = r.metadata.vulnerabilities.high || 0;
            const critical = r.metadata.vulnerabilities.critical || 0;
            const total = low + moderate + high + critical;
            console.log(JSON.stringify({ low, moderate, high, critical, total }));
            if (total > 0) process.exit(1);
          ")
          echo "vulns=$VULNS" >> $GITHUB_OUTPUT

      - name: Summarize vulnerabilities
        if: failure()
        run: |
          echo "## npm Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('audit-report.json','utf8'));
            const vulns = r.vulnerabilities || {};
            for (const [pkg, info] of Object.entries(vulns)) {
              const severity = info.severity || 'unknown';
              const via = info.via.filter(v => typeof v === 'object').map(v => v.title).join(', ');
              console.log('- **' + pkg + '** (' + severity + '): ' + via);
            }
          " >> $GITHUB_STEP_SUMMARY

      - name: Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('audit-report.json','utf8'));
            const m = r.metadata.vulnerabilities;
            const body = [
              '## Weekly Security Audit Results',
              '',
              '| Severity | Count |',
              '|---|---|',
              '| Critical | ' + (m.critical || 0) + ' |',
              '| High | ' + (m.high || 0) + ' |',
              '| Moderate | ' + (m.moderate || 0) + ' |',
              '| Low | ' + (m.low || 0) + ' |',
              '',
              'See the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security vulnerabilities found (' + new Date().toISOString().slice(0, 10) + ')',
              body: body,
              labels: ['security', 'automated'],
            });
